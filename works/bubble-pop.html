<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Pop — Melissa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39+Extended+Text&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    body { overflow: hidden; height: 100vh; }
    #project-frame {
      width: 100vw;
      height: calc(100vh - 60px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">MELISSA COCO</a>
      <div class="nav-links">
        <a href="../index.html#works" data-it="Lavori" data-en="Works">Works</a>
        <a href="../index.html#about" data-it="About" data-en="About">About</a>
        <a href="../index.html#contact" data-it="Contatti" data-en="Contact">Contact</a>
      </div>
      <button id="lang-toggle" data-it="EN" data-en="IT">EN</button>
    </div>
  </nav>
  <iframe id="project-frame" src="../Manionetta%20bolle/index.html" allow="camera; microphone"></iframe>
  <script>
    const langBtn = document.getElementById('lang-toggle')
    let lang = localStorage.getItem('lang') || 'it'
    function applyLang(l) {
      lang = l
      localStorage.setItem('lang', l)
      document.querySelectorAll('[data-it],[data-en]').forEach(el => {
        if (el.dataset[l]) el.textContent = el.dataset[l]
      })
      langBtn.textContent = l === 'it' ? 'EN' : 'IT'
    }
    langBtn.addEventListener('click', () => { applyLang(lang === 'it' ? 'en' : 'it') })
    applyLang(lang)
  </script>
</body>
</html>
