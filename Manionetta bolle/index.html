<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Pop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
    #app-canvas { display: block; width: 100vw; height: 100vh; }
    #debug-video { display: none; }
    #pip-video {
      position: fixed; left: 20px; bottom: 20px; width: 200px;
      border-radius: 10px; transform: scaleX(-1); z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.15);
    }
    #start-screen {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #fff; font-family: system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    #start-screen h1 { font-size: 2rem; margin-bottom: 8px; }
    #start-screen p { font-size: 1rem; opacity: 0.8; margin-bottom: 24px; }
    #start-btn {
      padding: 14px 40px; font-size: 1.1rem;
      border: none; border-radius: 50px;
      background: linear-gradient(135deg, #ffb6c1, #87ceeb);
      color: #111; font-weight: 700; cursor: pointer;
      transition: transform 0.2s;
    }
    #start-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <video id="debug-video" autoplay playsinline></video>
  <video id="pip-video" autoplay playsinline></video>
  <div id="start-screen">
    <h1>Bubble Pop</h1>
    <p>Scoppia almeno <strong>10 bolle</strong> in <strong>30 secondi</strong> usando le mani!</p>
    <button id="start-btn">INIZIA</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>

  <script>
    // --- DOM refs ---
    const canvas = document.getElementById('app-canvas');
    const ctx = canvas.getContext('2d');
    const debugVideo = document.getElementById('debug-video');
    const pipVideo = document.getElementById('pip-video');

    // --- resize ---
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let lastTime = performance.now();

    // --- Game State ---
    let score = 0;
    let timeRemaining = 30;
    let gameActive = false;
    let gameOver = false;
    let gameResult = null;

    function resetGame() {
      score = 0;
      timeRemaining = 30;
      gameActive = true;
      gameOver = false;
      gameResult = null;
    }

    // --- Handpose ---
    let detector = null;
    let handData = null;

    async function setupHandpose() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      debugVideo.srcObject = stream;
      pipVideo.srcObject = stream;
      await debugVideo.play();
      await pipVideo.play();

      const model = handPoseDetection.SupportedModels.MediaPipeHands;
      detector = await handPoseDetection.createDetector(model, {
        runtime: 'mediapipe',
        modelType: 'full',
        solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240',
        maxHands: 1,
      });
    }

    function getFingerTips(landmarks) {
      if (!landmarks || landmarks.length === 0) return null;
      const hand = landmarks[0];
      const flipX = (x) => (debugVideo.videoWidth - x) * (canvas.width / debugVideo.videoWidth);
      const toY = (y) => y * (canvas.height / debugVideo.videoHeight);
      return {
        indexTip: { x: flipX(hand.keypoints[8].x), y: toY(hand.keypoints[8].y) },
        thumbTip: { x: flipX(hand.keypoints[4].x), y: toY(hand.keypoints[4].y) },
        landmarks: hand,
      };
    }

    async function detectHands() {
      if (!detector || debugVideo.readyState < 2) return;
      const hands = await detector.estimateHands(debugVideo);
      handData = getFingerTips(hands);
    }

    // --- Background ---
    const bgColors = [
      [255, 182, 193],
      [173, 216, 230],
      [216, 191, 255],
      [255, 218, 185],
      [179, 255, 206],
    ];
    let bgColorA = bgColors[0];
    let bgLerp = 0;
    let bgTargetPair = [bgColors[1], bgColors[2]];

    function updateBackground(dt) {
      bgLerp += dt * 0.05;
      if (bgLerp >= 1) {
        bgLerp = 0;
        bgColorA = bgTargetPair[0];
        let available = bgColors.filter(c => c !== bgTargetPair[0] && c !== bgTargetPair[1]);
        let next = available[Math.floor(Math.random() * available.length)];
        bgTargetPair = [bgTargetPair[1], next];
      }
    }

    function renderBackground() {
      const a = bgColorA;
      const b = bgTargetPair[0];
      const t = bgLerp;
      const r = Math.round(a[0] + (b[0] - a[0]) * t);
      const g = Math.round(a[1] + (b[1] - a[1]) * t);
      const bl = Math.round(a[2] + (b[2] - a[2]) * t);
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, `rgb(${r},${g},${bl})`);
      grad.addColorStop(1, `rgb(${bl},${r},${g})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // --- Bubble System ---
    const BUBBLE_COUNT = 15;
    const BUBBLE_MIN_R = 30;
    const BUBBLE_MAX_R = 80;
    const BUBBLE_COLORS = [
      '#ffb6c1', '#87ceeb', '#d8b4fe', '#ffdab9', '#b3ffce',
      '#fda4af', '#67e8f9', '#c4b5fd', '#fdba74', '#86efac',
    ];

    let bubbles = [];

    function createBubble() {
      const r = BUBBLE_MIN_R + Math.random() * (BUBBLE_MAX_R - BUBBLE_MIN_R);
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: r,
        color: BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)],
        phase: Math.random() * Math.PI * 2,
        speed: 15 + Math.random() * 25,
        alive: true,
        popTimer: 0,
      };
    }

    function initBubbles() {
      bubbles = [];
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        bubbles.push(createBubble());
      }
    }
    initBubbles();

    function updateBubbles(dt) {
      for (const b of bubbles) {
        if (!b.alive) {
          b.popTimer -= dt;
          if (b.popTimer <= 0) {
            Object.assign(b, createBubble());
          }
          continue;
        }
        b.phase += dt * b.speed * 0.01;
        b.x += Math.sin(b.phase) * 0.8;
        b.y -= Math.cos(b.phase) * 0.4;
        if (b.x < -b.r) b.x = canvas.width + b.r;
        if (b.x > canvas.width + b.r) b.x = -b.r;
        if (b.y < -b.r) b.y = canvas.height + b.r;
        if (b.y > canvas.height + b.r) b.y = -b.r;
      }
    }

    function renderBubbles() {
      for (const b of bubbles) {
        if (!b.alive) continue;
        const grad = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, 0, b.x, b.y, b.r);
        grad.addColorStop(0, 'rgba(255,255,255,0.8)');
        grad.addColorStop(0.3, b.color);
        grad.addColorStop(1, 'rgba(255,255,255,0.1)');
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x - b.r*0.25, b.y - b.r*0.25, b.r*0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fill();
      }
    }

    // --- Pinch ---
    const PINCH_THRESHOLD = 35;
    let isPinching = false;

    function updatePinch() {
      if (!handData) { isPinching = false; return; }
      const dx = handData.indexTip.x - handData.thumbTip.x;
      const dy = handData.indexTip.y - handData.thumbTip.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      isPinching = dist < PINCH_THRESHOLD;
    }

    function renderCursor() {
      if (!handData) return;
      const p = handData.indexTip;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = isPinching ? 'rgba(255,100,100,0.6)' : 'rgba(255,255,255,0.5)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // --- Pop ---
    const POP_MARGIN = 10;
    function randomRespawnDelay() { return 2 + Math.random(); }

    function detectPop() {
      if (!isPinching || !handData) return;
      const points = [handData.indexTip, handData.thumbTip];
      let closest = null;
      let closestDist = Infinity;

      for (const b of bubbles) {
        if (!b.alive) continue;
        for (const p of points) {
          const dx = p.x - b.x;
          const dy = p.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy) - b.r;
          if (dist < POP_MARGIN && dist < closestDist) {
            closestDist = dist;
            closest = b;
          }
        }
      }

      if (closest) {
        popBubble(closest);
      }
    }

    // --- Score Float Text ---
    let scoreFloats = [];

    function spawnScoreFloat(x, y) {
      scoreFloats.push({ x, y, life: 1, vy: -80 });
    }

    function updateScoreFloats(dt) {
      for (let i = scoreFloats.length - 1; i >= 0; i--) {
        const f = scoreFloats[i];
        f.y += f.vy * dt;
        f.life -= dt * 1.2;
        if (f.life <= 0) scoreFloats.splice(i, 1);
      }
    }

    function renderScoreFloats() {
      for (const f of scoreFloats) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 8;
        ctx.fillText('+1', f.x, f.y);
        ctx.restore();
      }
    }

    // --- Confetti ---
    let confetti = [];

    function spawnConfetti(count) {
      const colors = ['#ffb6c1','#87ceeb','#d8b4fe','#ffdab9','#b3ffce','#fda4af','#67e8f9','#c4b5fd','#fdba74','#86efac','#ffeb3b','#ff6b6b'];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 100,
          w: 6 + Math.random() * 8,
          h: 4 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 200,
          vy: 100 + Math.random() * 200,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 6,
          life: 2 + Math.random() * 2,
        });
      }
    }

    function updateConfetti(dt) {
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vy += 120 * dt;
        c.rot += c.rotSpeed * dt;
        c.life -= dt;
        if (c.life <= 0 || c.y > canvas.height + 50) confetti.splice(i, 1);
      }
    }

    function renderConfetti() {
      for (const c of confetti) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = Math.min(1, c.life);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
    }

    // --- Particles ---
    let particles = [];
    const PARTICLE_COUNT = 20;

    function spawnParticles(x, y, color) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2 + Math.random() * 4,
          color: color,
          life: 0.6,
          maxLife: 0.6,
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function renderParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // --- Sound ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function ensureAudio() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPopSound(bubbleRadius) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'sine';
      const baseFreq = 400 + (bubbleRadius / BUBBLE_MAX_R) * 400;
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.3, audioCtx.currentTime + 0.08);

      const volume = 0.15 + (bubbleRadius / BUBBLE_MAX_R) * 0.15;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playTickSound() {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.06);
    }

    function playWinSound() {
      ensureAudio();
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        const t = audioCtx.currentTime + i * 0.12;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      });
    }

    function playLoseSound() {
      ensureAudio();
      const notes = [400, 350, 300, 200];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        const t = audioCtx.currentTime + i * 0.15;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      });
    }

    function popBubble(bubble) {
      bubble.alive = false;
      bubble.popTimer = randomRespawnDelay();
      spawnParticles(bubble.x, bubble.y, bubble.color);
      playPopSound(bubble.r);
      if (gameActive) {
        score++;
        spawnScoreFloat(bubble.x, bubble.y - 20);
      }
    }

    function renderHUD() {
      if (!gameActive && !gameOver) return;
      ctx.save();

      const cx = canvas.width / 2;
      const lowTime = timeRemaining <= 10;
      const pulse = lowTime ? 1 + Math.sin(performance.now() / 150) * 0.06 : 1;

      // --- Timer bar (bottom center) ---
      const barW = Math.min(400, canvas.width - 80);
      const barH = 10;
      const barX = (canvas.width - barW) / 2;
      const barY = canvas.height - 60;
      const fill = timeRemaining / 30;

      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 6;

      // background bar
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 5);
      ctx.fill();

      // fill bar
      const barColor = fill > 0.33 ? '#87ceeb' : fill > 0.15 ? '#ffdab9' : '#ff6b6b';
      ctx.fillStyle = barColor;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW * fill, barH, 5);
      ctx.fill();

      // timer text
      ctx.shadowBlur = 0;
      ctx.font = `bold ${Math.round(18 * pulse)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = lowTime ? '#ff6b6b' : '#fff';
      ctx.fillText(Math.ceil(timeRemaining) + 's', cx, barY - 6);

      // --- Score badge (bottom right) ---
      const badgeX = canvas.width - 170;
      const badgeY = canvas.height - 56;
      const badgeW = 154;
      const badgeH = 44;

      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 12);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillStyle = score >= 10 ? '#b3ffce' : '#fff';
      ctx.fillText('' + score + ' / 10', badgeX + badgeW / 2, badgeY + badgeH / 2);

      ctx.restore();
    }

    function renderGameOver() {
      if (!gameOver) return;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 20;

      if (gameResult === 'win') {
        ctx.font = 'bold 56px system-ui, sans-serif';
        ctx.fillStyle = '#b3ffce';
        ctx.fillText('VITTORIA!', cx, cy - 50);
        ctx.shadowBlur = 0;
        ctx.font = '26px system-ui, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`${score} bolle scoppiate!`, cx, cy + 15);
      } else {
        ctx.font = 'bold 52px system-ui, sans-serif';
        ctx.fillStyle = '#ff6b6b';
        ctx.fillText('TEMPO SCADUTO!', cx, cy - 50);
        ctx.shadowBlur = 0;
        ctx.font = '24px system-ui, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Solo ${score} bolle su 10`, cx, cy + 15);
      }

      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('Muovi la mano per ricominciare', cx, cy + 65);

      ctx.restore();
    }

    async function start() {
      await setupHandpose();
      lastTime = performance.now();

      let moveCountdown = 0;
      let lastTickSecond = -1;
      let gameEnded = false;

      function loop() {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        detectHands().then(() => {
          updatePinch();
          detectPop();

          if (gameActive) {
            timeRemaining -= dt;

            const curSec = Math.ceil(timeRemaining);
            if (curSec <= 10 && curSec > 0 && curSec !== lastTickSecond) {
              playTickSound();
              lastTickSecond = curSec;
            }

            if (timeRemaining <= 0) {
              timeRemaining = 0;
              gameActive = false;
              gameOver = true;
              gameResult = score >= 10 ? 'win' : 'lose';
              moveCountdown = 2;
              gameEnded = false;
            }
          }

          if (gameOver && !gameEnded) {
            gameEnded = true;
            if (gameResult === 'win') {
              spawnConfetti(120);
              playWinSound();
            } else {
              playLoseSound();
            }
          }

          if (gameOver) {
            if (handData) {
              moveCountdown -= dt;
              if (moveCountdown <= 0) {
                resetGame();
                moveCountdown = 0;
                lastTickSecond = -1;
                confetti = [];
                gameEnded = false;
              }
            } else {
              moveCountdown = 2;
            }
          }

          updateBackground(dt);
          updateBubbles(dt);
          updateParticles(dt);
          updateScoreFloats(dt);
          updateConfetti(dt);

          renderBackground();
          renderBubbles();
          renderParticles();
          renderScoreFloats();
          renderConfetti();
          renderCursor();
          renderHUD();
          renderGameOver();

          requestAnimationFrame(loop);
        });
      }
      loop();
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-screen').style.display = 'none';
      resetGame();
    });

    start().catch(console.error);
  </script>
</body>
</html>
