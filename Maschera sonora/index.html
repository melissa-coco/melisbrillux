<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girandola Sonora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39+Extended+Text&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #caf0f8;
      display: flex;
      flex-direction: column;
      font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 16px 32px;
      background: rgba(10,10,10,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-inner {
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: 'Libre Barcode 39 Extended Text', cursive;
      font-size: 23px;
      color: #f0f0f0;
      text-decoration: none;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      gap: 27px;
    }

    .nav-links a {
      color: #999;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      inset: -10px -16px;
      background: linear-gradient(135deg,
        rgba(255,0,0,0.7), rgba(0,255,0,0.7),
        rgba(76,249,225,0.7), rgb(69,107,212,0.7),
        rgba(255,87,51,0.7), rgba(51,255,87,0.7));
      background-size: 300% 300%;
      filter: blur(16px);
      opacity: 0;
      transition: opacity 0.5s;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    .nav-links a:hover {
      color: #f0f0f0;
    }

    .nav-links a:hover::after {
      opacity: 0.4;
      animation: lavaNav 8s ease infinite;
    }

    @keyframes lavaNav {
      0%   { background-position: 0% 0%; border-radius: 47% 53% 45% 55% / 67% 59% 41% 33%; }
      25%  { background-position: 100% 0%; border-radius: 55% 45% 59% 41% / 43% 61% 39% 57%; }
      50%  { background-position: 100% 100%; border-radius: 41% 59% 53% 47% / 57% 43% 61% 39%; }
      75%  { background-position: 0% 100%; border-radius: 59% 41% 47% 53% / 39% 57% 43% 61%; }
      100% { background-position: 0% 0%; border-radius: 47% 53% 45% 55% / 67% 59% 41% 33%; }
    }

    #lang-toggle {
      background: none;
      border: 1px solid #444;
      color: #f0f0f0;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    #lang-toggle:hover {
      border-color: #f0f0f0;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: 56px;
    }

    #pinwheel-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding-top: 80px;
    }

    #girandola {
      width: 80vmin;
      height: auto;
    }

    #blades-wrapper {
      transform-origin: 298.95px 307.43px;
      transition: transform 0.4s ease;
    }

    #blades-wrapper.growing {
      transform: scale(1.5);
    }

    #spin-layer {
      transform-origin: 298.95px 307.43px;
    }

    #spin-layer.spinning {
      animation: spin var(--speed, 2s) linear infinite;
    }

    @keyframes spin {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    #controls {
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #999;
      font-size: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .control-group label {
      white-space: nowrap;
      min-width: auto;
      font-weight: 400;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 10px;
      color: #777;
    }

    .control-group:first-child {
      background: none;
      border: none;
      padding: 0;
    }

    #mic-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.25s;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    #mic-btn:hover { background: rgba(255,255,255,0.1); }
    #mic-btn.active { background: rgba(46,125,50,0.3); border-color: #4caf50; color: #81c784; }

    #sound-level {
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    #sound-level-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
      transition: width 0.05s linear;
    }

    #sound-level-threshold {
      position: absolute;
      top: -1px;
      bottom: -1px;
      width: 2px;
      background: #fff;
      border-radius: 1px;
      opacity: 0.8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f39200;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 8px rgba(243,146,0,0.3);
      margin-top: -5px;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(243,146,0,0.5);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
    }

    #level-display, #sensitivity-display, #speed-min-display, #speed-max-display {
      min-width: 28px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #ddd;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">MELISSA COCO</a>
      <div class="nav-links">
        <a href="../index.html#works" data-it="Lavori" data-en="Works">Works</a>
        <a href="../index.html#about" data-it="About" data-en="About">About</a>
        <a href="../index.html#contact" data-it="Contatti" data-en="Contact">Contact</a>
      </div>
      <button id="lang-toggle" data-it="EN" data-en="IT">EN</button>
    </div>
  </nav>
  <div id="app">
    <div id="pinwheel-container">
      <svg id="girandola" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89">
        <defs>
          <style>
            .cls-1 { fill: #7d4e24; }
            .cls-1, .cls-2, .cls-3, .cls-4 { stroke: #1d1d1b; stroke-miterlimit: 10; stroke-width: .5px; }
            .cls-2 { fill: #f39200; }
            .cls-3 { fill: #009fe3; }
            .cls-4 { fill: #d60b52; }
          </style>
        </defs>
        <g id="stecca">
          <rect class="cls-1" x="283.2" y="403.6" width="33.68" height="208.82"/>
        </g>
        <g id="blades-wrapper">
          <g id="spin-layer">
            <g id="centro">
              <circle class="cls-3" id="centro-circle" cx="298.95" cy="307.43" r="30.24"/>
            </g>
            <g id="ali_arancioni">
              <path class="cls-2" id="ala-arancione-1" d="M161.01,163.65h115.91l80.39,80.39-29.91,29.91c-3.03-2.49-12.86-9.94-27.48-10.42-16.48-.54-27.69,8.13-30.48,10.42-36.14-36.77-72.29-73.53-108.43-110.3Z"/>
              <path class="cls-2" id="ala-arancione-2" d="M437.16,452.17h-115.91l-80.39-80.39,29.91-29.91c3.03,2.49,12.86,9.94,27.48,10.42,16.48.54,27.69-8.13,30.48-10.42,36.14,36.77,72.29,73.53,108.43,110.3Z"/>
            </g>
            <g id="ali_ciliegia">
              <path class="cls-4" id="ala-ciliegia-1" d="M440.23,167.05v117.71s-79.16,81.64-79.16,81.64l-29.45-30.38c2.46-3.08,9.78-13.06,10.26-27.9.53-16.73-8-28.12-10.26-30.95,36.2-36.71,72.41-73.41,108.61-110.12Z"/>
              <path class="cls-4" id="ala-ciliegia-2" d="M156.42,446.32v-115.91l80.39-80.39,29.91,29.91c-2.49,3.03-9.94,12.86-10.42,27.48-.54,16.48,8.13,27.69,10.42,30.48-36.77,36.14-73.53,72.29-110.3,108.43Z"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div id="controls">
      <div class="control-group">
        <button id="mic-btn">Microfono</button>
      </div>
      <div class="control-group">
        <label>📊</label>
        <div id="sound-level">
          <div id="sound-level-fill"></div>
          <div id="sound-level-threshold"></div>
        </div>
        <span id="level-display">0</span>
      </div>
      <div class="control-group">
        <label for="sensitivity" data-it="🔈 Sensibilità" data-en="🔈 Sensitivity">🔈 Sensibilità</label>
        <input type="range" id="sensitivity" min="1" max="100" value="90">
        <span id="sensitivity-display">90</span>
      </div>
      <div class="control-group">
        <label for="speed-min" data-it="🔉 Volume basso" data-en="🔉 Low volume">🔉 Volume basso</label>
        <input type="range" id="speed-min" min="500" max="5000" value="900" step="100">
        <span id="speed-min-display">0.9s</span>
      </div>
      <div class="control-group">
        <label for="speed-max" data-it="🔊 Volume alto" data-en="🔊 High volume">🔊 Volume alto</label>
        <input type="range" id="speed-max" min="100" max="3000" value="100" step="100">
        <span id="speed-max-display">0.1s</span>
      </div>
    </div>
  </div>
  <script>
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let source = null;
    let stream = null;
    let isListening = false;
    let isSoundActive = false;

    const SENSITIVITY_DEFAULT = 90;
    const SILENCE_FRAMES = 8;
    const LERP_SPEED = 0.1;
    const langDict = {
      it: { micIdle: '🎤 Avvia microfono', micActive: '🟢 In ascolto', micError: 'Impossibile accedere al microfono. Verifica i permessi.' },
      en: { micIdle: '🎤 Start microphone', micActive: '🟢 Listening', micError: 'Cannot access microphone. Check permissions.' },
    };
    let silenceCounter = 0;
    let sensitivity = SENSITIVITY_DEFAULT;
    let speedMinMs = 900;
    let speedMaxMs = 100;
    let smoothDuration = 2000;

    const COLORS = {
      centro: { start: '#009fe3', target: '#e6332a' },
      ali_arancioni: { start: '#f39200', target: '#662483' },
      ali_ciliegia: { start: '#d60b52', target: '#009640' },
    };

    const svgElement = document.getElementById('girandola');
    const wrapper = document.getElementById('blades-wrapper');
    const spinLayer = document.getElementById('spin-layer');

    const elements = {
      centro: document.getElementById('centro-circle'),
      ali_arancioni: [
        document.getElementById('ala-arancione-1'),
        document.getElementById('ala-arancione-2'),
      ],
      ali_ciliegia: [
        document.getElementById('ala-ciliegia-1'),
        document.getElementById('ala-ciliegia-2'),
      ],
    };

    function parseColor(str) {
      if (str.startsWith('#')) {
        const hex = str.slice(1);
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16),
        };
      }
      const m = str.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if (m) {
        return { r: +m[1], g: +m[2], b: +m[3] };
      }
      return { r: 0, g: 0, b: 0 };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, '0')).join('');
    }

    function lerpColor(c1, c2, t) {
      return rgbToHex(
        c1.r + (c2.r - c1.r) * t,
        c1.g + (c2.g - c1.g) * t,
        c1.b + (c2.b - c1.b) * t
      );
    }

    let colorAnimId = null;

    function lerpToTarget(targetColors, duration = 400) {
      if (colorAnimId) cancelAnimationFrame(colorAnimId);

      const startColors = {};
      for (const [key, ids] of Object.entries(elements)) {
        const el = Array.isArray(ids) ? ids[0] : ids;
        const computedStyle = getComputedStyle(el);
        startColors[key] = parseColor(computedStyle.fill || COLORS[key].start);
      }

      const targetRgb = {};
      for (const [key, val] of Object.entries(targetColors)) {
        targetRgb[key] = parseColor(val);
      }

      const startTime = performance.now();

      function animateColor(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);

        for (const [key, ids] of Object.entries(elements)) {
          const color = lerpColor(startColors[key], targetRgb[key], ease);
          if (Array.isArray(ids)) {
            ids.forEach(el => el.style.fill = color);
          } else {
            ids.style.fill = color;
          }
        }

        if (t < 1) {
          colorAnimId = requestAnimationFrame(animateColor);
        }
      }

      colorAnimId = requestAnimationFrame(animateColor);
    }

    function setSound() {
      wrapper.classList.add('growing');
      spinLayer.classList.add('spinning');
      lerpToTarget({
        centro: COLORS.centro.target,
        ali_arancioni: COLORS.ali_arancioni.target,
        ali_ciliegia: COLORS.ali_ciliegia.target,
      });
    }

    function setNoSound() {
      wrapper.classList.remove('growing');
      spinLayer.classList.remove('spinning');
      lerpToTarget({
        centro: COLORS.centro.start,
        ali_arancioni: COLORS.ali_arancioni.start,
        ali_ciliegia: COLORS.ali_ciliegia.start,
      });
    }

    async function startAudio() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isListening = true;
        document.getElementById('mic-btn').classList.add('active');
        document.getElementById('mic-btn').textContent = langDict[lang].micActive;
        analyzeLoop();
      } catch (err) {
        console.error('Microfono non disponibile:', err);
        alert(langDict[lang].micError);
      }
    }

    function stopAudio() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      if (audioCtx) {
        audioCtx.close();
      }
      audioCtx = null;
      analyser = null;
      source = null;
      stream = null;
      isListening = false;
      document.getElementById('mic-btn').classList.remove('active');
      document.getElementById('mic-btn').textContent = langDict[lang].micIdle;
      setNoSound();
    }

    function mapAmplitudeToSpeed(level, threshold255) {
      const range = 255 - threshold255;
      if (range <= 0) return speedMaxMs;
      const t = Math.min(Math.max(0, level - threshold255) / range, 1);
      return speedMinMs + t * (speedMaxMs - speedMinMs);
    }

    function analyzeLoop() {
      if (!isListening) return;

      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const level = sum / dataArray.length;

      const threshold255 = Math.max(3, 255 - sensitivity * 2.5);

      const fill = document.getElementById('sound-level-fill');
      fill.style.width = Math.min(100, (level / 255) * 100) + '%';

      document.getElementById('level-display').textContent = Math.round((level / 255) * 100);

      if (level > threshold255) {
        silenceCounter = 0;
        if (!isSoundActive) {
          isSoundActive = true;
          setSound();
        }
        if (isSoundActive) {
          const target = mapAmplitudeToSpeed(level, threshold255);
          smoothDuration += (target - smoothDuration) * LERP_SPEED;
          spinLayer.style.animationDuration = Math.round(smoothDuration) + 'ms';
        }
      } else {
        silenceCounter++;
        if (silenceCounter >= SILENCE_FRAMES && isSoundActive) {
          isSoundActive = false;
          setNoSound();
        }
      }

      requestAnimationFrame(analyzeLoop);
    }

    document.getElementById('mic-btn').addEventListener('click', () => {
      if (isListening) {
        stopAudio();
      } else {
        startAudio();
      }
    });

    document.getElementById('sensitivity').addEventListener('input', (e) => {
      sensitivity = parseInt(e.target.value);
      document.getElementById('sensitivity-display').textContent = sensitivity;
      const thresholdPct = Math.max(1, (100 - sensitivity * 2.5 / 2.55));
      document.getElementById('sound-level-threshold').style.left = thresholdPct + '%';
    });

    document.getElementById('speed-min').addEventListener('input', (e) => {
      speedMinMs = parseInt(e.target.value);
      document.getElementById('speed-min-display').textContent = (speedMinMs / 1000).toFixed(1) + 's';
    });

    document.getElementById('speed-max').addEventListener('input', (e) => {
      speedMaxMs = parseInt(e.target.value);
      document.getElementById('speed-max-display').textContent = (speedMaxMs / 1000).toFixed(1) + 's';
    });

    const initThresholdPct = Math.max(1, (100 - SENSITIVITY_DEFAULT * 2.5 / 2.55));
    document.getElementById('sound-level-threshold').style.left = initThresholdPct + '%';

    let lang = localStorage.getItem('lang') || 'it';

    function applyLang(l) {
      lang = l;
      localStorage.setItem('lang', l);
      document.querySelectorAll('[data-it],[data-en]').forEach(el => {
        if (el.dataset[l]) el.textContent = el.dataset[l];
      });
      document.getElementById('lang-toggle').textContent = l === 'it' ? 'EN' : 'IT';
      const btn = document.getElementById('mic-btn');
      if (btn.classList.contains('active')) {
        btn.textContent = langDict[l].micActive;
      } else {
        btn.textContent = langDict[l].micIdle;
      }
    }

    document.getElementById('lang-toggle').addEventListener('click', () => {
      applyLang(lang === 'it' ? 'en' : 'it');
    });

    applyLang(lang);
  </script>
</body>
</html>
